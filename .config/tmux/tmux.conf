#set leader + r to reload tmux.conf
unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# set leader key to ctrl+s
set -g prefix C-s

# navigate panes using vim keymaps
setw -g mode-keys vi 
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# allow mouse scrolling in tmux terminals
set -g mouse on

# status position
set -g status-position top
set -g base-index 1
set -g pane-base-index 1
set -g status-bg default
set -g monitor-bell on
set -g visual-bell off
set -g bell-action any

# list of tpm plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
set -g @plugin 'rcmdnk/tmux-notify'

# theme stuff
set -g @plugin '2KAbhishek/tmux2k'
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-icons-only false
set -g @tmux2k-left-plugins 'session pomodoro'
set -g @tmux2k-right-plugins 'network time'
set -g @tmux2k-show-powerline true
set -g @tmux2k-window-list-alignment 'left'
set -g @tmux2k-window-list-compact 'false'
set -g @tmux2k-window-list-format "#I:#W"
set -g @tmux2k-left-sep ' '
set -g @tmux2k-right-sep ' '
set -g @tmux2k-refresh-rate 5
set -g @tmux2k-bg-main default
set -g @tmux2k-git-display-status 'true'
set -g @tmux2k-weather-display-condition 'false'
set -g @tmux2k-time-format '%m/%d %H:%M'
set -g @tmux2k-pomodoro-colors "orange black"
set -g @tmux2k-session-colors "green black"
set -g @tmux2k-network-colors "pink black"
set -g @tmux2k-time-colors "purple black"

# init tmux plugin manager (keep at very bottom of tmux.conf)
run $XDG_CONFIG_HOME/tmux/plugins/tpm/tpm
