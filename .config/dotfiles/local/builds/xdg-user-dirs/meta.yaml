{% set name = "xdg-user-dirs" %}
{% set version = "0.20" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://gitlab.freedesktop.org/xdg/xdg-user-dirs/-/archive/v{{ version }}/xdg-user-dirs-v{{ version }}.tar.gz
  sha256: 988d3f3274cb2b69796ace22ddbb0abfc2c0157fff65258045f055cfba024d6e

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - meson
    - ninja
    - pkg-config
    - gettext
  host:
    - glib
    - libiconv
  run:
    - glib
    - libiconv

about:
  home: https://gitlab.freedesktop.org/xdg/xdg-user-dirs
  license: GPL-3.0-or-later
  summary: "Manage user directories like ~/Desktop and ~/Music"
