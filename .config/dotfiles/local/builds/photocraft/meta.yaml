{% set name = "photocraft" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/storytold/photocraft/releases/download/v0.10.0/photocraft-0.10.0-linux-x86_64.tar.gz
  sha256: c5d455785d9c2eaf695bf8e6327c4d6d23a39ddb956a6114f0c5b64326f984e1

build:
  number: 2
  binary_relocation: false
  detect_binary_files_with_prefix: false

about:
  home: https://github.com/storytold/photocraft
  license: Apache-2.0
  summary: "PhotoCraft: An open-source, photo editor written by scratch in pure Rust"
