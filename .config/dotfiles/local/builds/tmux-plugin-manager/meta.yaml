{% set name = "tmux-plugin-manager" %}
{% set version = "3.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/tmux-plugins/tpm/archive/refs/tags/v3.1.0.tar.gz
  sha256: 2411fc416c4475d297f61078d0a03afb3a1f5322fff26a13fdb4f20d7e975570

build:
  number: 1
  binary_relocation: false
  detect_binary_files_with_prefix: false

about:
  home: https://github.com/tmux-plugins/tpm
  license: MIT
  summary: "Tmux Plugin Manager"
