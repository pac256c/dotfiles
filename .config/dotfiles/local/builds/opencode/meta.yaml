{% set name = "opencode" %}
{% set version = "1.19.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-linux-x64.tar.gz
  sha256: 13a8fb2978302071b86f9d7e00da9c8895f9cd846978379c3bdc6a5333536c9b

build:
  number: 2
  binary_relocation: false
  detect_binary_files_with_prefix: false


requirements:
  run:
    - ripgrep

about:
  home: https://github.com/anomalyco/opencode
  license: Apache-2.0
  summary: "The open source coding agent."
