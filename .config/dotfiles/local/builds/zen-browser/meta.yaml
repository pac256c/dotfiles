{% set name = "zen-browser" %}
{% set version = "1.23.3b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zen-browser/desktop/releases/download/1.23.3b/zen.linux-x86_64.tar.xz
  sha256: bb2045d3e21654d40fe841250092eeadfd2c1fc831eefb509222773c8bdca149

build:
  number: 0
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  run:
    - gtk3
    - dbus
    - alsa-lib
    - xorg-libx11
    - xorg-libxcomposite
    - xorg-libxdamage
    - xorg-libxext
    - xorg-libxfixes
    - xorg-libxrandr
    - xorg-libxt

about:
  home: https://github.com/zen-browser/desktop
  license: MPL-2.0
  summary: "Zen Browser (Firefox-based, prebuilt tarball)"
