# ArtCraft app list — one app per line:
#
#   <name> <github-owner/repo> [override,key=value,...]
#
# Examples:
#   photocraft storytold/photocraft
#   pdfcraft storytold/pdfcraft depends=poppler-glib,cairo;asset=pdfcraft-0.8.0-linux-x86_64.tar.gz
#
# Recognized overrides (semicolon-separated, no spaces):
#   asset=<filename>   exact release asset to use (instead of <name>-<ver>-linux-x86_64.tar.gz)
#   depends=a,b,c      extra runtime depends for the PKGBUILD

photocraft storytold/photocraft
wordcraft storytold/wordcraft
