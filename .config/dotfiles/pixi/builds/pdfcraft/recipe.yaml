context:
  name: "pdfcraft"
  version: "0.17.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/pdfcraft/releases/download/v0.17.0/pdfcraft-0.17.0-linux-x86_64.tar.gz
  sha256: f9814a7a0af77b905adba1c3079caedee537586797043cf5af9503914f6abec5

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/pdfcraft
  license: Apache-2.0
  summary: "PdfCraft: An open-source PDF reader and editor written by scratch in pure Rust"
