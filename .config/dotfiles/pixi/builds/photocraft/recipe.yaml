context:
  name: "photocraft"
  version: "0.19.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/photocraft/releases/download/v0.19.0/photocraft-0.19.0-linux-x86_64.tar.gz
  sha256: 123385b1730ace18f12bc0f494606e6a4cd3f4ab891f93036cd4e71b8aea70f7

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/photocraft
  license: Apache-2.0
  summary: "PhotoCraft: An open-source, photo editor written by scratch in pure Rust"
