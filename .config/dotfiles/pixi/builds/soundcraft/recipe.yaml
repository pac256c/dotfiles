context:
  name: "soundcraft"
  version: "0.8.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/soundcraft/releases/download/v0.8.0/soundcraft-0.8.0-linux-x86_64.tar.gz
  sha256: 57a2b8776d51880cee69118568a396c09faca6949dcbf50f19879d71d596f5cc

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/soundcraft
  license: Apache-2.0
  summary: "An open-source, clean-room reimplementation of Avid Pro Tools in pure Rust"
