context:
  name: "soundcraft"
  version: "0.16.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/soundcraft/releases/download/v0.16.0/soundcraft-0.16.0-linux-x86_64.tar.gz
  sha256: 25c6b0cb8924198f22e3a6f2771d7dcc9e041a3244a4be445cbde9d00e7dc19e

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/soundcraft
  license: Apache-2.0
  summary: "An open-source, clean-room reimplementation of Avid Pro Tools in pure Rust"
