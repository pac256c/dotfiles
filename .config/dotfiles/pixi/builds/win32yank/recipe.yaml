context:
  name: "win32yank"
  version: "0.1.1"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/equalsraf/win32yank/releases/download/v0.1.1/win32yank-x64.zip
  sha256: 247c9a05b94387a884b49d3db13f806b1677dfc38020f955f719be6902260cd6

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/equalsraf/win32yank
  license: ISC
  summary: "Windows clipboard tool (WSL clipboard bridge for neovim)"
