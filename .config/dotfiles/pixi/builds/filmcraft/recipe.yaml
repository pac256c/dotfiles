context:
  name: "filmcraft"
  version: "0.9.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/filmcraft/releases/download/v0.9.0/filmcraft-0.9.0-linux-x86_64.tar.gz
  sha256: ea67953cc754bfd8272e0e5fa940518e16068ae96f6b72a2dce566ed69a61632

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/filmcraft
  license: Apache-2.0
  summary: "FilmCraft: An open-source, nonlinear video editor written by scratch in pure Rust"
