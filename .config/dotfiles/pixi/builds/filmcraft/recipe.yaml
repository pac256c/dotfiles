context:
  name: "filmcraft"
  version: "0.16.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz
  sha256: 588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/filmcraft
  license: Apache-2.0
  summary: "FilmCraft: An open-source, nonlinear video editor written by scratch in pure Rust"
