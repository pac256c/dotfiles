context:
  name: "zen-browser"
  version: "1.23.3b"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/zen-browser/desktop/releases/download/1.23.3b/zen.linux-x86_64.tar.xz
  sha256: bb2045d3e21654d40fe841250092eeadfd2c1fc831eefb509222773c8bdca149
  file_name: zen.linux-x86_64.tar.xz

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

requirements:
  run:
    - gtk3
    - dbus
    - alsa-lib
    - xorg-libx11
    - xorg-libxcomposite
    - xorg-libxdamage
    - xorg-libxext
    - xorg-libxfixes
    - xorg-libxrandr
    - xorg-libxt

about:
  homepage: https://github.com/zen-browser/desktop
  license: MPL-2.0
  summary: "Zen Browser (Firefox-based, prebuilt tarball)"
