context:
  name: "wordcraft"
  version: "0.14.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/wordcraft/releases/download/v0.14.0/wordcraft-0.14.0-linux-x86_64.tar.gz
  sha256: 3010da3d352d95256ec9a17a03966280a1d41ba09d0ebe569af23092d8b64987

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/wordcraft
  license: Apache-2.0
  summary: "An open-source, clean-room reimplementation of Microsoft Word in pure Rust"
