context:
  name: "cadcraft"
  version: "0.16.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/storytold/cadcraft/releases/download/v0.16.0/cadcraft-0.16.0-linux-x86_64.tar.gz
  sha256: 149820b3d0e1e729a2256e344523b9805871d39ee39c9e085f507707f73ccbd4

build:
  number: 2
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore_binary_files: true

about:
  homepage: https://github.com/storytold/cadcraft
  license: Apache-2.0
  summary: "CADCraft: computer-aided design and drafting  an open-source, clean-room AutoCAD-style app in pure Rust"
